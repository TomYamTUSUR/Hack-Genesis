# Пути нужны только для первичного импорта data/* в БД (см. bin/import_data.rb,
# lib/payment_routing/importers) - сам рейтинг/стратегии эти файлы не читают,
# они работают только с db/operations.db.
data:
  providers_file: data/providers.json
  operations_history_file: data/operations_history.csv
  operations_queue_file: data/operations_queue_10.json

strategies_file: config/strategies.yml

# payment_system'ы, которые участвуют в рейтинге. Явный список вместо неявного
# "все активные провайдеры" - потому что providers также содержит self-provider
# (fallback), который в рейтинге не участвует (пока нет hard-constraints,
# отличить его иначе, чем по имени, нечем).
rated_providers:
  - vipay
  - payflow
  - quickpay
